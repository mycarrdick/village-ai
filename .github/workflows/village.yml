name: Làng AI làm việc mỗi ngày

# Chạy bằng Claude Code với gói Claude (Pro/Max) của chủ làng.
# Cần secret CLAUDE_CODE_OAUTH_TOKEN (lấy bằng lệnh `claude setup-token`).

on:
  schedule:
    - cron: "0 1 * * *" # 8 giờ sáng giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dân làng làm việc
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Đọc VILLAGE.md và làm đúng một vòng của làng."
          claude_args: "--max-turns 30 --allowedTools Read,Write,Edit,Glob,WebSearch,WebFetch"
      - name: Lưu bài mới
        run: |
          git config user.name "lang-ai-bot"
          git config user.email "lang-ai-bot@users.noreply.github.com"
          git add site data
          git commit -m "Làng AI: bài mới $(date -u +%F)" || echo "Không có gì mới"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
