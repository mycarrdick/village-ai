name: Kiểm tra chiến dịch Accesstrade

# Chỉ lấy link affiliate, không viết bài (không tốn hạn mức Claude).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          ACCESSTRADE_KEY: ${{ secrets.ACCESSTRADE_KEY }}
        run: node src/accesstrade.js
      - run: |
          git config user.name "lang-ai-bot"
          git config user.email "lang-ai-bot@users.noreply.github.com"
          git add data/affiliates.json
          git commit -m "Cập nhật chiến dịch Accesstrade" || echo "Không đổi"
          git push
